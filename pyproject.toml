[project]
name = "amazonas-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "affine>=2.4.0",
    "dagster>=1.12.11",
    "dagster-dg-cli>=1.12.10",
    "dagster-webserver>=1.12.10",
    "fiona>=1.10.1",
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "osmium>=4.2.0",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.251201",
    "rasterio>=1.4.4",
    "rpy2>=3.6.6",
    "scipy>=1.15.3",
    "shapely>=2.1.2",
    "types-geopandas>=1.1.3.20260408",
]

[dependency-groups]
dev = [
    "ipykernel<7",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "PLR2004", "ANN401", "COM812"]

[tool.basedpyright]
typeCheckingMode = "standard"
ignore = ["**/*.ipynb"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "amazonas_pipeline"
